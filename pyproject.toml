[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plum-virion"
version = "0.1.0"
description = "Read-only MCP interface to Plum-Island"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp==1.26.0", "httpx>=0.27,<1", "PyYAML>=6.0.3,<7"]

[project.optional-dependencies]
dev = ["black>=25", "pylint>=3.3"]

[project.scripts]
plum-virion = "plum_virion.__main__:main"

[tool.setuptools.packages.find]
include = ["plum_virion*"]
